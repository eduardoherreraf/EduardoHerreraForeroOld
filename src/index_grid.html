    <style>
        /* ========================================
           CONVERSIÓN DE FLEXBOX A CSS GRID
           ======================================== */
        
        /* NAVBAR: Conversión de d-flex a Grid */
        .navbar-brand {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 0.25rem;
        }
        
        .navbar-nav {
            display: grid;
            grid-auto-flow: column;
            justify-content: end;
            gap: 0;
        }
        
        @media (max-width: 991.98px) {
            .navbar-nav {
                grid-auto-flow: row;
                justify-content: center;
            }
        }
        
        /* LAYOUT PRINCIPAL: Conversión de row a Grid */
        #introduccion main.row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
        }
        
        @media (min-width: 992px) {
            #introduccion main.row {
                grid-template-columns: 75% 25%;
            }
        }
        
        /* ASIDE: Mantener sticky */
        aside {
            align-self: flex-start;
            position: sticky;
            top: 1rem;
        }
        
        /* FOOTER: Conversión completa a Grid */
        
        /* Footer contenedor principal */
        footer.row {
            display: grid;
            grid-template-rows: auto auto;
            gap: 1rem;
        }
        
        footer > .row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        @media (min-width: 992px) {
            footer > .row {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        /* SECCIÓN CONTACTO: d-flex flex-column align-items-center */
        footer address.col-lg-4 {
            display: grid;
            grid-template-rows: auto auto auto;
            justify-items: center;
            gap: 0.5rem;
        }
        
        /* d-flex flex-row align-items-center */
        footer address .d-flex.flex-row {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 0.75rem;
        }
        
        /* SECCIÓN DERECHOS DE AUTOR: d-flex flex-column align-items-center justify-content-center */
        footer .col-lg-4:nth-child(2) {
            display: grid;
            grid-template-rows: auto auto;
            justify-items: center;
            align-content: center;
            height: 100%;
        }
        
        /* SECCIÓN REDES SOCIALES: d-flex flex-column align-items-center */
        footer .col-lg-4:nth-child(3) {
            display: grid;
            grid-template-rows: auto auto;
            justify-items: center;
            gap: 1rem;
        }
        
        /* d-flex justify-content-evenly align-items-center gap-5 */
        footer .col-lg-4:nth-child(3) > div:last-child {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            justify-items: center;
            align-items: center;
            gap: 3rem;
        }
        
        /* Footer bottom: d-flex align-items-center justify-content-center gap-2 */
        footer > div:last-child {
            display: grid;
            grid-auto-flow: column;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }
        
        /* Sobreescribir clases de Bootstrap para usar Grid */
        .d-grid-custom {
            display: grid !important;
        }
    </style>
</head>
